services:
  postgres:
    container_name: postgres-sql-wac
    image: postgres
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: whatsapp_clone
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - whatsapp-clone
    restart: unless-stopped

  keycloak:
    container_name: keycloak-wac
    image: quay.io/keycloak/keycloak:26.0.0
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - whatsapp-clone
    command:
      - "start-dev"

  frontend:
    container_name: whatsapp-frontend
    build:
      context: ./whatsapp-clone-ui   # Path to your Angular project
      dockerfile: Dockerfile
    ports:
      - "4200:4200"  # Expose Angular dev server
    volumes:
      - ./whatsapp-clone-ui:/workspace  # Mount code for live editing
    networks:
      - whatsapp-clone
    command: >
      sh -c "ng serve --host 0.0.0.0 --poll=2000"
    depends_on:
      - postgres
      - keycloak
    restart: unless-stopped

networks:
  whatsapp-clone:
    driver: bridge

volumes:
  postgres:
    driver: local